# Default values for kube-token-exchanger.

# -- Overrides the full name of chart resources.
fullnameOverride: ""

image:
  repository: ghcr.io/lukaspj/kube-token-exchanger
  # -- Image tag. Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Number of operator replicas. The operator elects a leader, so >1 is safe.
replicaCount: 1

serviceAccount:
  # -- Annotations to add to the ServiceAccount.
  annotations: {}

# -- Connection settings for the authentik instance performing the RFC 8693
# token exchange. Configured on the operator, not on TokenExchangeRequests.
authentik:
  # -- Base URL of the authentik instance. Required.
  url: ""
  # -- OAuth2 scopes requested on exchanged tokens.
  scopes:
    - openid
  # -- Optional: path of the token endpoint. Defaults to /application/o/token/.
  tokenPath: ""
  # -- HTTP request timeout against authentik.
  timeout: 15s
  # -- Disable TLS certificate verification. Do not use in production.
  insecureTLS: false
  # -- OAuth2 client ID used to authenticate the token exchange against
  # authentik. Required by authentik on the token endpoint.
  clientID: ""
  # -- Plain client secret. Prefer clientSecretSecret in production.
  clientSecret: ""
  # -- Optional: mount a Secret holding the OAuth2 client secret.
  clientSecretSecret:
    # -- Name of the Secret (leave empty to disable).
    name: ""
    # -- Key in the Secret holding the client secret.
    key: "client-secret"
    # -- Optional: continue startup if the Secret is missing.
    optional: false
  # -- Optional: mount a Secret holding a PEM certificate authority used to
  # verify the authentik TLS certificate.
  caCertSecret:
    # -- Name of the Secret (leave empty to disable).
    name: ""
    # -- Key in the Secret holding the PEM bundle.
    key: "ca.crt"
    # -- Optional: path of the token endpoint secret key file.
    optional: false

# -- Operator command-line flags.
args:
  leaderElect: true

metrics:
  # -- Bind address for the metrics endpoint inside the pod.
  bindAddress: ":8080"
  service:
    enabled: true
    type: ClusterIP
    port: 8080
  # -- Set to true to render a ServiceMonitor (requires kube-prometheus-stack CRDs).
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}

health:
  # -- Bind address for the health probe endpoint inside the pod.
  bindAddress: ":8081"

rbac:
  # -- Create the ClusterRole and ClusterRoleBinding.
  create: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

securityContext:
  privileged: false
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault
  capabilities:
    drop:
      - ALL
    add: []

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

livenessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 10

nodeSelector: {}

tolerations: []

affinity: {}

priorityClassName: ""

# -- Extra pod labels.
podLabels: {}

# -- Extra pod annotations.
podAnnotations: {}

# -- Termination grace period in seconds.
terminationGracePeriodSeconds: 30
