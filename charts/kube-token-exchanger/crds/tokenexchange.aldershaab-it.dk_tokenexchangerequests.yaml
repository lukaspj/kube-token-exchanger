kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tokenexchangerequests.tokenexchange.aldershaab-it.dk
spec:
  group: tokenexchange.aldershaab-it.dk
  names:
    kind: TokenExchangeRequest
    listKind: TokenExchangeRequestList
    plural: tokenexchangerequests
    singular: tokenexchangerequest
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.serviceAccount.name
      name: ServiceAccount
      type: string
    - jsonPath: .spec.audience
      name: Audience
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.tokenExpiresAt
      name: Expires
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TokenExchangeRequest is the Schema for the tokenexchangerequests
          API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TokenExchangeRequestSpec defines the desired state of TokenExchangeRequest.
            properties:
              audience:
                description: |-
                  Audience is the bound audience requested for the minted Kubernetes
                  ServiceAccount token. It must match the audience configuration of the
                  OIDC source registered in authentik.
                type: string
              authentik:
                description: |-
                  Authentik holds the connection settings for the authentik token
                  endpoint performing the RFC 8693 token exchange.
                properties:
                  caCert:
                    description: |-
                      CACert references a PEM certificate authority used to verify the
                      authentik TLS certificate.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  clientAssertionAudience:
                    description: |-
                      ClientAssertionAudience is the audience requested for the client
                      assertion token. Defaults to the resolved OAuth2 client ID.
                    type: string
                  clientAssertionServiceAccount:
                    description: |-
                      ClientAssertionServiceAccount is the ServiceAccount whose bound token
                      is presented as the client_assertion when clientAuthMethod is
                      privateKeyJwt. Required in that mode. When Namespace is empty, the
                      namespace of the TokenExchangeRequest is used.
                    properties:
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - name
                    type: object
                  clientAuthMethod:
                    default: clientSecretPost
                    description: |-
                      ClientAuthMethod selects how the operator authenticates itself to
                      authentik.

                      "clientSecretPost" (default) sends the OAuth2 client_secret in the
                      token request body.

                      "privateKeyJwt" presents a freshly minted Kubernetes ServiceAccount
                      token as a client_assertion (JWT bearer, RFC 7523) signed by the
                      Kubernetes API server. authentik must trust the Kubernetes API
                      server's JWKS. No client_secret is required.
                    enum:
                    - clientSecretPost
                    - privateKeyJwt
                    type: string
                  clientId:
                    description: ClientID references the OAuth2 client_id used for
                      the exchange.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  clientSecret:
                    description: |-
                      ClientSecret references the OAuth2 client_secret used for the exchange.
                      Ignored when clientAuthMethod is privateKeyJwt.
                    properties:
                      key:
                        type: string
                      name:
                        type: string
                      namespace:
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  insecureTLS:
                    description: |-
                      InsecureTLS disables TLS certificate verification. Do not enable in
                      production.
                    type: boolean
                  scopes:
                    description: Scopes requested on the exchanged token, e.g. openid,
                      email.
                    items:
                      type: string
                    type: array
                  timeout:
                    description: Timeout for HTTP requests against authentik. Defaults
                      to 15s.
                    type: string
                  tokenEndpointPath:
                    description: |-
                      TokenEndpointPath overrides the token endpoint path.
                      Defaults to /application/o/token/.
                    type: string
                  url:
                    description: |-
                      URL is the base URL of the authentik instance, e.g.
                      https://authentik.example.com.
                    type: string
                required:
                - clientId
                - clientSecret
                - url
                type: object
              refreshWindow:
                description: |-
                  RefreshWindow defines how long before expiry a new exchange is
                  triggered. Defaults to 30s.
                type: string
              serviceAccount:
                description: |-
                  ServiceAccount identifies the Kubernetes ServiceAccount whose identity
                  token is exchanged for an authentik identity token.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              targetSecret:
                description: TargetSecret is the Secret the exchanged authentik token
                  is written to.
                properties:
                  name:
                    type: string
                  namespace:
                    type: string
                required:
                - name
                type: object
              tokenLifetime:
                description: |-
                  TokenLifetime is the requested lifetime of the minted Kubernetes
                  ServiceAccount token. Defaults to 5m.
                type: string
            required:
            - audience
            - authentik
            - serviceAccount
            - targetSecret
            type: object
          status:
            description: TokenExchangeRequestStatus defines the observed state of
              TokenExchangeRequest.
            properties:
              conditions:
                description: Conditions represent the latest available observations
                  of the exchange.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              issuedTokenType:
                description: IssuedTokenType is the token type returned by authentik.
                type: string
              lastExchangeTime:
                description: LastExchangeTime is the last time an exchange succeeded.
                format: date-time
                type: string
              scope:
                description: Scope lists the scopes granted on the issued token.
                type: string
              tokenExpiresAt:
                description: |-
                  TokenExpiresAt is the expiry time of the token currently stored in the
                  target Secret.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
